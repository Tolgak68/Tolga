# Inspiratie voor de digital garden van Tolga

Ik als ontwerper

---

# Introtekst

Ik ben Tolga en ik studeer CMD aan de HvA. Hier laat ik zien wat ik ontwerp, wat ik leer en hoe ik groei als ontwerper. Van mijn eerste schetsen tot nu.

---

# Onderwerp

Ik wil al een tijd een portfolio voor mezelf bouwen. In mijn vrije tijd zou ik dat niet snel doen, dus dit blok komt mooi uit.

Ik wil laten zien wat ik ontwerp, wat ik heb geleerd en hoe ik het heb gedaan. Zo houd ik mijn groei als ontwerper bij en kan de buitenwereld die groei ook zien.
