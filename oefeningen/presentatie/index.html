# Inspiratie voor de digital garden van Tolga

Ik als ontwerper

---

# Introtekst

Ik ben Tolga en ik studeer CMD aan de HvA. Hier laat ik zien wat ik ontwerp, wat ik leer en hoe ik groei als ontwerper. Van mijn eerste schetsen tot nu.

---

# Onderwerp

Ik wil al een tijd een portfolio voor mezelf bouwen. In mijn vrije tijd zou ik dat niet snel doen, dus dit blok komt mooi uit.

Ik wil laten zien wat ik ontwerp, wat ik heb geleerd en hoe ik het heb gedaan. Zo houd ik mijn groei als ontwerper bij en kan de buitenwereld die groei ook zien.

# Wat ik zie in mijn 50 afbeeldingen

Veel donkere achtergronden met felle kleuren erin, vooral roze, paars en groen.

Mijn eigen werk begint bijna altijd met schetsen op papier en wordt daarna een prototype of scherm.

Gaming komt steeds terug. Bij Bruno Simon en GTA 6, maar ook in mijn eigen Unity game en 3D stadion.

Veel sites laten groei zien, met versies, een archief of groeifases. Veel portfolio's hebben ook een knop voor licht en donker.

---

# 10 links

1. [Maggie Appleton](https://maggieappleton.com/garden), elke tekst heeft een groeifase
2. [Lynn Fisher](https://lynnandtonic.com), elk jaar een nieuwe versie van haar site
3. [Bruno Simon](https://bruno-simon.com), een portfolio kan ook een game zijn
4. [GTA 6](https://www.rockstargames.com/VI), de roze en paarse kleuren
5. [Mike Mai](https://mikemai.net), zelf je thema kiezen en grote stoere letters
6. [Ste Grainer](https://stegrainer.com), duidelijke knoppen voor licht en donker
7. [Basher](https://basher.biz), een grote eerste letter zoals bij mijn oefening van Sanne
8. [Armaina](https://armaina.com), een archief van al haar werk vanaf het begin
9. [Kwon](https://kwon.nyc/internet/), waarom je een eigen website zou maken
10. [Web Design Museum](https://www.webdesignmuseum.org), hoe websites er vroeger uitzagen

---

# Hoe ik het wil vertellen

Per project laat ik de schetsen, het prototype en het eindresultaat zien. Zo zie je hoe een idee groeit.

Bij elk project schrijf ik kort wat ik heb geleerd en wat ik nu anders zou doen.

Mijn garden is nooit af. Elk blok komt er iets bij.
